name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install libusb
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
          else
            brew install libusb pkg-config
          fi
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Static Linux builds
        if: runner.os == 'Linux'
        run: make linux

  ui:
    name: Admin UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build
        run: make ui
      - name: Commit and push built UI if changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain internal/agent/web/dist)" ]; then
            git config --local user.name "chenpinetree"
            git config --local user.email "chenpinetree@users.noreply.github.com"
            git add internal/agent/web/dist
            git commit -m "build(ui): bundle latest admin ui [skip ci]"
            git push
          fi
