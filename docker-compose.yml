version: '3.8'

services:
  simcallhub:
    image: simcallhub:local
    container_name: simcallhub
    restart: unless-stopped
    privileged: true
    # 强烈建议 host 模式：避免 Docker NAT 转换影响 SIP 媒体流与动态 RTP 端口
    network_mode: host
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - HAOBOT_DATA=/data
      - SIM_SIP_USER=1001          # SIP 分机号
      - SIM_SIP_PASS=12345678      # SIP 分机密码
      - SIM_SIP_LISTEN=0.0.0.0:5060
    command: ["serve", "-listen", "0.0.0.0", "-transport", "usb"]
